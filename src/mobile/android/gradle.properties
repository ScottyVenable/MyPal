# Project-wide Gradle settings for MyPal AI

# JVM memory allocation for Gradle daemon
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Enable parallel execution for faster builds
org.gradle.parallel=true

# Enable Gradle build cache
org.gradle.caching=true

# AndroidX migration flags
android.useAndroidX=true
android.enableJetifier=true

# React Native architecture flags
# Set to true to enable the New Architecture (Fabric + TurboModules)
newArchEnabled=false

# Enable Hermes JavaScript engine (default for RN 0.73+)
hermesEnabled=true

# Suppress Kotlin daemon fallback warning
kotlin.daemon.jvmargs=-Xmx1536m
